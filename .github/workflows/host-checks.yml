name: host-checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "scripts/**"
      - "ci/**"
      - "config/**"
      - ".github/workflows/host-checks.yml"

concurrency:
  group: host-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Secret scan (full history)
        run: ./gitleaks git --log-opts="--all" --exit-code 1 --verbose

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Baseline manifest self-test
        run: python3 ci/baseline_manifest.py --self-test

      - name: Host verification
        run: python3 scripts/verify-local.py --ci-config config/0143.env

      - name: Build TWRP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          CC=clang sh tools/twrp/build.sh
