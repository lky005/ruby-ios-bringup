name: host-checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "scripts/**"
      - "ci/**"
      - "config/**"
      - ".github/workflows/host-checks.yml"

concurrency:
  group: host-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Baseline manifest self-test
        run: python3 ci/baseline_manifest.py --self-test

      - name: Host verification
        run: python3 scripts/verify-local.py --ci-config config/0140.env

      - name: Build TWRP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          CC=clang sh tools/twrp/build.sh
