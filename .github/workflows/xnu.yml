name: xnu-0087

# Builds the ruby kernel without vendoring the upstream tree.
# ci/prepare-baseline.sh takes a content-pinned 82-file baseline (private
# mirror; ALLOW_PUBLIC_UPSTREAM=1 is the external fallback), adds this
# project's patches, applies the small 0010/0012 change, and verifies the
# canonical patchset hash. ci/kernel_hash.py records the built kernel's
# segments; it gates against a booted reference only when the branch's
# config/*.env provides one.

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main]
    paths:
      - "ci/**"
      - "patches/**"
      - "config/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Content pin of the 82-file sweet 0001-0079 baseline (see ci/README.md).
  # The repo/ref/key live in Actions secrets: BASELINE_REPO, BASELINE_REF,
  # BASELINE_SSH_KEY. The public pin is the manifest root, not a URL.
  BASELINE_MANIFEST_SHA256: 829d759826607027bc4a1d9818b6dd4956a312a087217b6ce7e5ce31fa3ae910
  BASELINE_FILES: "82"
  PATCHSET_SHA256: 27894e7b274ea57131b5ee57799eb13c1ca2ddd7a6d9e38c15468cdd0dd55ce9
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}
  # ccache: xnu is ~2000 compiles; a patch usually changes a few of them
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_macro,pch_defines
  CCACHE_MAXSIZE: 3G
  CCACHE_WRAP: ${{ github.workspace }}/ccache-bin

jobs:
  build:
    # macos-14 still ships Xcode 15.x: its iig matches the xnu-8796 IORPC ABI
    # (Xcode 16's iig emits IORPC.kernelContent, which this xnu lacks)
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch private baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.BASELINE_REPO }}
          ref: ${{ secrets.BASELINE_REF }}
          ssh-key: ${{ secrets.BASELINE_SSH_KEY }}
          path: baseline-src
          persist-credentials: false

      - name: Prepare pinned baseline
        env:
          BASELINE_DIR: baseline-src
        run: |
          sh ci/prepare-baseline.sh base

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp base/xnu/patches/*.patch base/xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64.
          # ruby: Cortex-A55/A76 (ARMv8.2), keep the kernel on Cortex-A55
          # (clang's apple-m1 default emits LSE atomics and LDAPR)
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="arm64" VALID_ARCHS="arm64" OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a55"/' dxb/build.sh
          grep -c 'OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a55"' dxb/build.sh
          # xnu's makedefs take CC/CXX from the environment dxb exports; xcodebuild
          # (mig, ctf tools) needs a single executable, so point at wrappers
          sed -i '' 's|export CC="$(xcrun -find clang)"|export CC="$CCACHE_WRAP/clang"|; s|export CXX="$(xcrun -find clang++)"|export CXX="$CCACHE_WRAP/clang++"|' dxb/build.sh
          grep -c 'export CC="$CCACHE_WRAP/clang"' dxb/build.sh
          ls dxb/patches | tail

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja ccache
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC="/Applications/Xcode_15.0.1.app"
          if [ ! -d "$XC" ]; then
            echo "Xcode 15.0.1 not found; refusing to drift to another Xcode"
            exit 1
          fi
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig
          mkdir -p "$CCACHE_WRAP"
          for t in clang clang++; do
            printf '#!/bin/sh\nexec ccache %s "$@"\n' "$(xcrun -find $t)" > "$CCACHE_WRAP/$t"
            chmod +x "$CCACHE_WRAP/$t"
          done
          cat "$CCACHE_WRAP/clang"

      - name: Restore ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}-${{ hashFiles('ci/**', 'patches/**', 'config/0087.env', '.github/workflows/xnu.yml') }}
          restore-keys: |
            ccache-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}-

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          ccache -z
          bash build.sh
          ccache -s

      - name: Package build tree for local compiles
        if: always()
        run: |
          if [ ! -d dxb ]; then
            echo "dxb missing; build did not start"
            exit 0
          fi
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          shopt -s nullglob
          libs=(/Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a)
          if [ ${#libs[@]} -eq 0 ]; then
            echo "no KDK support libs found"
            exit 0
          fi
          for lib in "${libs[@]}"; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - name: Kernel hash gate
        if: always()
        run: |
          if [ ! -f out/kernel.development.sweet ]; then
            echo "kernel missing; hash gate skipped"
            exit 0
          fi
          . config/0087.env
          if [ -n "${KERNEL_EXPECT_EXEC_DATA:-}" ]; then
            python3 ci/kernel_hash.py --expect-exec-data "$KERNEL_EXPECT_EXEC_DATA" \
              out/kernel.development.sweet | tee out/kernel-hashes.txt
          else
            echo "no booted reference yet; recording kernel hashes"
            python3 ci/kernel_hash.py out/kernel.development.sweet | tee out/kernel-hashes.txt
          fi

      - name: Provenance
        if: always()
        run: |
          patchset=missing
          patches=0
          if [ -d base/xnu/patches ]; then
            patchset=$(python3 ci/patchset_hash.py base/xnu/patches)
            patches=$(ls base/xnu/patches/*.patch 2>/dev/null | wc -l)
          fi
          {
            echo "baseline_manifest=$BASELINE_MANIFEST_SHA256"
            echo "baseline_files=$BASELINE_FILES"
            echo "baseline_upstream=ios-topaz@5095ac19dbdcf37b64b81fe443f4027ad51b84bf"
            echo "apple_xnu=xnu-8796.141.3"
            echo "patchset_sha256=$patchset"
            echo "dxb_repo=$DXB_REPO"
            echo "dxb_sha=$DXB_SHA"
            echo "macos_version=$MACOS_VERSION"
            echo "kernel_config=$KERNEL_CONFIG"
            echo "machine_config=$MACHINE_CONFIG"
            echo "patches=$patches"
            echo "xcode=$(xcodebuild -version | tr '\n' ' ')"
            echo "sw_vers=$(sw_vers | tr '\n' ' ')"
            echo "brew=$(brew list --versions jq gum bash cmake ninja ccache 2>/dev/null | tr '\n' ';')"
            echo "run_id=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
          } > out/PROVENANCE.txt
          cat out/PROVENANCE.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
